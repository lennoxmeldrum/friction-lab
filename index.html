<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="frame-ancestors *" />
    <title>Friction Lab — Inclined Plane Experiment</title>
    <script>
      // Apply dark mode before first paint to avoid a light-theme flash when
      // the wrapper signals dark via ?theme=dark.
      (function () {
        try {
          var t = new URLSearchParams(window.location.search).get('theme');
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
